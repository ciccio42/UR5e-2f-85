# Perception strategy:
# - generalized: discover object categories from the scene
# - prior_guided: use prior knowledge about expected objects
perception_mode: generalized

grounding_dino:
  # Crop applied only to the image passed to GroundingDINO.
  # VLM discovery, SAM, SAM2, depth and camera geometry keep
  # using the complete image.
  crop:
    top_px: 80
    bottom_px: 0
    left_px: 0
    right_px: 0

keyframe_selector:

  # Keyframe selection strategy:
  # - hand_velocity: original SeeDo implementation
  # - vlm: semantic pick/place selection using a VLM
  mode: vlm
  sample_stride: 5
  model: gpt-4o-2024-08-06

  gaussian_sigma: 5.0
  prominence: 0.8
  expected_keyframes: 2
  save_preview: false

visual_prompter:
  grounding_config: /opt/checkpoints/seedo/groundingdino/GroundingDINO_SwinB.cfg.py
  grounding_checkpoint: /opt/checkpoints/seedo/groundingdino/groundingdino_swinb_cogcoor.pth
  bert_model: /opt/checkpoints/seedo/bert-base-uncased
  sam_checkpoint: /opt/checkpoints/seedo/sam/sam_vit_h_4b8939.pth
  sam2_checkpoint: /opt/checkpoints/seedo/sam2/sam2_hiera_large.pt

  # Leave null to use automatic recognition via OpenAI.
  # Alternatively: "cube,cube,cube,cube,storage bin,storage bin,storage bin,storage bin"
  objects: null

action_planner:
  model: gpt-4o-2024-08-06
  # Ordering of bins in the demonstration image used to recover
  # the canonical front-view ordinal.
  demonstration_bin_order: left_to_right

structured_scene:
  # Number of qualitative spatial directions used to describe
  # relations between possible place destinations.
  # Supported values:
  # - 4: LEFT, RIGHT, UP, DOWN
  # - 8: also includes the four diagonal directions
  directions: 4

scene_perceiver:
  camera_calibration_path: /home/ros2_ws/src/UR5e-2f-85/zed_camera/zed_camera_calibration/estimated_camera_positions.yaml
  camera_name: zed_front
  workspace_bottom_left: [0.0, 0.0]
  workspace_top_right: [1.0, 1.0]

  camera_pose_noise:
    level: baseline

    levels:
      baseline:
        translation_std_mm: 0.0
        rotation_std_deg: 0.0

      # Noise levels both translation and rotation are applied to the camera pose. 
      # The translation noise is applied independently to each axis (x, y, z) with a Gaussian distribution centered at 0 and the specified standard deviation in millimeters. 
      # The rotation noise is applied independently to each axis (roll, pitch, yaw) with a Gaussian distribution centered at 0 and the specified standard deviation in degrees
      noise_1.0_0.1:
        translation_std_mm: 1.0
        rotation_std_deg: 0.1

      noise_3.0_0.25:
        translation_std_mm: 3.0
        rotation_std_deg: 0.25

      noise_5.0_1.0:
        translation_std_mm: 5.0
        rotation_std_deg: 1.0

      noise_10.0_2.0:
        translation_std_mm: 10.0
        rotation_std_deg: 2.0

      noise_25.0_5.0:
        translation_std_mm: 25.0
        rotation_std_deg: 5.0

      # Noise levels where only translation noise is applied to the camera pose. 
      # The translation noise is applied independently to each axis (x, y, z) with a Gaussian distribution centered at 0 and the specified standard deviation in millimeters. 
      # The rotation noise is set to 0 degrees.
      noise_1.0_0.0:
        translation_std_mm: 1.0
        rotation_std_deg: 0.0

      noise_3.0_0.0:
        translation_std_mm: 3.0
        rotation_std_deg: 0.0

      noise_5.0_0.0:
        translation_std_mm: 5.0
        rotation_std_deg: 0.0

      noise_10.0_0.0:
        translation_std_mm: 10.0
        rotation_std_deg: 0.0

      noise_25.0_0.0:
        translation_std_mm: 25.0
        rotation_std_deg: 0.0

  detector_labels:
    - cube
    - storage bin

lmp_generator:
  model: gpt-4o-2024-08-06

scene_interpreter:
  model: gpt-4o-2024-08-06

motion_layer:
  grasp_orientation:
    - 0.9994452044624775
    - 0.03161651380119412
    - 0.0021438049655468088
    - 0.010251021036213035

  min_step: 0.02
  reach_hover_height: 0.15
  approach_z_offset: 0.0
  release_height_offset: 0.10
  lift_height: 0.15

  gripper_open_position: 0.1
  gripper_closed_position: 0.8

  object_y_offset: -0.04

grasp_planner:
  num_runs: 20
  seed: 42

  confidence_threshold: 0.4
  semantic_radius_px: 50.0

  max_approach_tilt_deg: 45.0
  max_wrist_rotation_deg: 45.0

  # M2T2 grasp-frame depth.
  #
  # M2T2 places the grasp-frame origin 0.1034 m behind the
  # contact region along the local approach (+Z) direction.
  # This value is used to recover the robot TCP grasp position.
  m2t2_gripper_depth_m: 0.1034

  depth_min: 0.15
  depth_max: 0.60
  bottom_ignore_px: 30

  # Disabled in the validated tests.
  surface_snap: 0.0

  finger_collision_check: true

  # Robotiq 2F-85 collision model.
  gripper_opening_m: 0.085
  finger_thickness_m: 0.031214
  finger_width_m: 0.027000
  finger_z_min_m: 0.0483
  finger_z_max_m: 0.1053
  collision_margin_m: 0.002
  collision_min_points: 3