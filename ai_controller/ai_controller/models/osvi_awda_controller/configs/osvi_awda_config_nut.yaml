# OSVI-AWDA runtime configuration.
# Model and trajectory sources are bundled beside this file. checkpoint_dir is
# resolved relative to this YAML and must contain config.yaml plus the checkpoint.

checkpoint_dir: "/home/ros2_ws/src/ai_controller/checkpoint_folder/osvi-awda/osvi_mtlfd_nut_assembly"
checkpoint_step: 48000 #nut assembly

# Use the calibration shipped with the real-data AWDA adaptation.
projection_matrix_path: "ur5e_zed_front_projection.yaml"
device: "cuda"

image:
  front_camera_index: 0
  height: 100
  width: 180
  crop: [0, 10, 140, 90]
  normalize: true
  live_images_are_rgb: true
  demo_convert_bgr_to_rgb: true
context:
  num_frames: 10
  sample_sides: true

agent_observation:
  num_frames: 2
  repeat_current_image: true

waypoints:
  base_count: 5
  sub_waypoints: true
  image_waypoints: true

projection:
  output_frame: "base_link"

control:
  orientation_mode: "fixed_top_down"
  fixed_orientation_xyzw:
    - 0.9994452044624775
    - 0.03161651380119412
    - 0.0021438049655468088
    - 0.010251021036213035
  gripper_open_position: 0.0
  gripper_closed_position: 255.0
  # Kept for diagnostics and for optionally restoring model-driven gripper flags.
  gripper_close_threshold: 0.1
  repository_grasp_shift_left: false

  fixed_gripper_schedule: true

  max_actions_per_inference: 5

grasp_refinement:
  # Implements mtlfd_adaptation/test_mtlfd_rollout.py::localize_grasp_target
  # after the robot reaches grasp_hint + hover_height_m.
  enabled: true
  use_gripper_depth: true
  depth_camera_name: "zed_gripper"
  depth_camera_node_name: "zed_node"
  depth_topic: "/zed_gripper/zed_node/depth/depth_registered"
  camera_info_topic: "/zed_gripper/zed_node/rgb/color/rect/camera_info"
  rgb_topic: "/zed_gripper/zed_node/rgb/color/rect/image"
  rgb_timeout_sec: 0.5
  depth_source_frame_override: "zed_mini_left_camera_frame_optical"
  depth_target_frame: "base_link"
  depth_ros_node_name: "osvi_awda_gripper_depth_refinement"
  depth_max_range_m: 0.5
  depth_window_px: 5
  camera_info_retries: 3
  camera_info_timeout_sec: 0.5
  depth_timeout_sec: 0.5
  tf_timeout_sec: 0.5

  depth_grasp_z_offset_m: -0.09
  max_depth_xy_correction_m: 0.1

  hover_height_m: 0.05
  approach_height_m: 0.01
  lift_height_m: 0.15

  # DEPTH EDGE DETECTION
  depth_edge_min_depth_m: 0.05
  depth_edge_max_depth_m: 0.5

  depth_edge_canny_low: 5
  depth_edge_canny_high: 15
  depth_edge_blur_kernel_px: 3

  # MODIFICATI
  depth_edge_close_kernel_px: 15
  depth_edge_close_iterations: 2
  depth_edge_min_contour_area_px: 10

  # ROI DEPTH
  depth_ignore_margins_px:
    top: 0
    bottom: 0
    left: 0
    right: 0

  depth_crop_left_px: 285
  depth_crop_right_px: 500
  depth_crop_top_px: 150

insert_refinement:
  enabled: true
  apply_to_actions: true

  # Depth frontale completa, senza crop
  min_depth_m: 0.01
  max_depth_m: 0.50
  display_max_depth_m: 1.00

  # Edge detection
  canny_low: 5
  canny_high: 15
  blur_kernel_px: 3

  # Morphological closing
  close_kernel_px: 11
  close_iterations: 1

  # Contour detection
  min_contour_area_px: 100
  depth_window_px: 7

  # Validazione
  max_projection_error_m: 0.005
  max_wp5_correction_m: 0.10

safety:
  clamp_workspace: true
  workspace_min: [-0.50, 0.20, -0.08]
  workspace_max: [0.50, 0.90, 0.50]
  min_waypoint_distance: 0.005

debug:
  show_waypoint_overlay: true
  save_waypoint_overlay: true
  waypoint_overlay_window: "OSVI-AWDA waypoint overlay"
  waypoint_overlay_wait_ms: 1
