# =============================================================================
# PI0.5 - UR5e runtime configuration
# =============================================================================


# -----------------------------------------------------------------------------
# CHECKPOINT
# -----------------------------------------------------------------------------

# Directory LeRobot "pretrained_model".
# Deve contenere almeno:
#   config.json
#   model.safetensors
#   policy_preprocessor.json
#   policy_postprocessor.json
#   policy_preprocessor_step_*.safetensors
#   policy_postprocessor_step_*.safetensors

checkpoint_path: "/home/ros2_ws/src/ai_controller/checkpoint_folder/pi05/pretrained_model"

device: "cuda"

postprocessor_config_filename: "policy_postprocessor.json"


# -----------------------------------------------------------------------------
# HTTP SERVER
# -----------------------------------------------------------------------------

# Server e client girano sulla stessa macchina/container host.
server_host: "127.0.0.1"
server_port: 8770

# PI0.5 può richiedere diversi secondi quando deve generare un nuovo
# action chunk.
server_inference_timeout: 120.0


# -----------------------------------------------------------------------------
# ACTION EXECUTION / REPLANNING
# -----------------------------------------------------------------------------

# Override runtime del valore salvato nel checkpoint.
#
# checkpoint:
#   chunk_size = 50
#   n_action_steps = 50
#
# n_action_steps = 1:
#   genera comunque un chunk di 50 azioni,
#   ma ne esegue soltanto una prima di interrogare nuovamente PI0.5
#   con la nuova osservazione.
#
# n_action_steps = 50:
#   comportamento originale del checkpoint.
#
# null:
#   non applica alcun override e usa il valore del checkpoint.
n_action_steps: 50


# -----------------------------------------------------------------------------
# CAMERA INPUT
# -----------------------------------------------------------------------------

# Ordine immagini prodotto da AIControllerNode:
#
#   images[0] = front
#   images[1] = left
#   images[2] = right
#   images[3] = gripper

front_camera_index: 0
gripper_camera_index: 3

# AIControllerNode usa cv_bridge con desired_encoding='rgb8'.
input_color_order: "rgb"


# -----------------------------------------------------------------------------
# DATASET ACTION REPRESENTATION
# -----------------------------------------------------------------------------

# Nel dataset UR5e:
#
#   action[:6] = physical_delta[:6] / 0.05
#
# quindi durante inference:
#
#   physical_delta[:6] = action[:6] * 0.05

dataset_action_scale: 0.05


# -----------------------------------------------------------------------------
# GRIPPER OUTPUT
# -----------------------------------------------------------------------------

# Comandi finali usati dal controller / nodo.
gripper_open_position: 0.0
gripper_closed_position: 255.0

# PI0.5 action[6] dopo il postprocessor è nello spazio dataset 0..20.
#
# Questi valori controllano soltanto l'isteresi open/close.
#
# Per ora manteniamo i valori definiti nelle pi05_utils.
gripper_open_threshold: 5.0
gripper_close_threshold: 19.0


# -----------------------------------------------------------------------------
# INFERENCE / DEBUG
# -----------------------------------------------------------------------------

seed: 1000

trace_action_conversions: false


# -----------------------------------------------------------------------------
# TASK PROMPTS
# -----------------------------------------------------------------------------

# Task originali UR5e: 4 colori x 4 bin.
#
# Gli ID 00, 05, 10, 15 corrispondono alle combinazioni held-out
# del dataset di fine-tuning.

tasks:

  "00":
    prompt: "Pick the green box and place it into the first bin"

  "01":
    prompt: "Pick the green box and place it into the second bin"

  "02":
    prompt: "Pick the green box and place it into the third bin"

  "03":
    prompt: "Pick the green box and place it into the fourth bin"

  "04":
    prompt: "Pick the yellow box and place it into the first bin"

  "05":
    prompt: "Pick the yellow box and place it into the second bin"

  "06":
    prompt: "Pick the yellow box and place it into the third bin"

  "07":
    prompt: "Pick the yellow box and place it into the fourth bin"

  "08":
    prompt: "Pick the blue box and place it into the first bin"

  "09":
    prompt: "Pick the blue box and place it into the second bin"

  "10":
    prompt: "Pick the blue box and place it into the third bin"

  "11":
    prompt: "Pick the blue box and place it into the fourth bin"

  "12":
    prompt: "Pick the red box and place it into the first bin"

  "13":
    prompt: "Pick the red box and place it into the second bin"

  "14":
    prompt: "Pick the red box and place it into the third bin"

  "15":
    prompt: "Pick the red box and place it into the fourth bin"